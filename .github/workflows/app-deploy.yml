# Exercise 9 - build both images, push them, deploy a new revision of each service (keyless auth).
name: app-deploy
on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/app-deploy.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
env:
  REGION: europe-north1
  REGISTRY: europe-north1-docker.pkg.dev/cloud-computing-continuum-gabi/notely
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/405866150955/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@cloud-computing-continuum-gabi.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet
      - name: Build and push both images (tag = commit SHA)
        run: |
          docker build --platform linux/amd64 -t "$REGISTRY/backend:$GITHUB_SHA" backend
          docker build --platform linux/amd64 -t "$REGISTRY/frontend:$GITHUB_SHA" frontend
          docker push "$REGISTRY/backend:$GITHUB_SHA"
          docker push "$REGISTRY/frontend:$GITHUB_SHA"
      # Only the image changes; env vars, secrets, VPC egress and identity are kept from the current revision.
      - name: Deploy new revisions
        run: |
          gcloud run deploy notely-backend --region "$REGION" --image "$REGISTRY/backend:$GITHUB_SHA" --quiet
          gcloud run deploy notely-frontend --region "$REGION" --image "$REGISTRY/frontend:$GITHUB_SHA" --quiet
